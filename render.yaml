services:
  - type: web
    name: artifact-grader
    env: node
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && node dist/server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_GRADE_MODEL
        value: gpt-4o-mini
      - key: AUDIO_BUCKET_NAME
        value: local-audio
      - key: DATABASE_URL
        fromDatabase:
          name: artifact-grader-db
          property: connectionString

databases:
  - name: artifact-grader-db
    databaseName: artifact_grader
    user: artifact_grader
    plan: starter
