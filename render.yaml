services:
  - type: web
    name: artifact-grader
    env: node
    # Render may omit devDependencies when NODE_ENV=production, which breaks TypeScript builds
    # (missing @types/*) and runtime migrations (drizzle-kit is a devDependency).
    buildCommand: npm ci --include=dev && npm run build && npm run db:push
    startCommand: npx tsx scripts/ingest-exemplars.ts && npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_GRADE_MODEL
        value: gpt-4o-mini
      - key: AUDIO_BUCKET_NAME
        value: local-audio
      - key: CORS_ORIGINS
        value: "*"  # Update this with your Next.js frontend URL in production (e.g., https://yourapp.vercel.app)
      - key: SERVE_FRONTEND
        value: "false"  # Set to "false" for API-only mode when Next.js is separate
      - key: DATABASE_URL
        fromDatabase:
          name: artifact-grader-db
          property: connectionString

databases:
  - name: artifact-grader-db
    databaseName: artifact_grader
    user: artifact_grader
    # Render has deprecated legacy Postgres plans (including 'starter') for new DBs.
    # Use a supported flexible plan.
    plan: basic-256mb
